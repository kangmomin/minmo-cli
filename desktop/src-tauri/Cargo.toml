[package]
name = "minmo-desktop"
version = "0.3.0"
description = "minmo — GitHub 이슈 단위 worktree 작업 공간"
edition = "2021"
rust-version = "1.77.2"

[lib]
# 이름에 _lib 를 붙여 bin 크레이트와 충돌하지 않게 한다 (Windows cargo 이슈 회피)
name = "minmo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "time"] }
# 내장 서버 토큰 암호화 키 생성(32바이트 → base64)
getrandom = "0.3"
base64 = "0.21"

# Windows 는 딥링크가 새 프로세스 인자로 들어오므로 single-instance 가 기존 창으로 전달해야 한다
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# 자동 업데이트(서명 검증 후 설치) — 웹뷰가 아니라 Rust 명령(update.rs)에서만 쓴다
tauri-plugin-updater = "2"

# keyring 3.x 는 기본 백엔드가 없다 → 플랫폼별 네이티브 백엔드를 명시
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# PTY 셸을 Job Object 에 넣어 부모가 먼저 끝난 자손(에이전트 등)까지 함께 종료한다
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
